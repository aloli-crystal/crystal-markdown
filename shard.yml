name: markdown
version: 0.1.7
description: |
  Universal Markdown converter for Crystal.
  Convert Markdown to PDF, EPUB, HTML, and reveal.js presentations.
  Chains kramdown-asciidoc with the asciicrystal ecosystem.
authors:
  - Philippe Nénert <philippe@aloli.fr>
license: MIT
dependencies:
  kramdown-asciidoc:
    github: aloli-crystal/kramdown-asciidoc
    branch: production
  asciicrystal:
    github: aloli-crystal/asciicrystal
    version: "~> 2.0.26.12"
  asciicrystal-pdf:
    github: aloli-crystal/asciicrystal-pdf
    version: "~> 2.3.24.108"
  asciicrystal-epub3:
    github: aloli-crystal/asciicrystal-epub3
    branch: production
  rouge:
    github: aloli-crystal/rouge
    version: "~> 4.7.0.3"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

crystal: ">= 1.19.0"
targets:
  markdown:
    main: src/cli.cr
